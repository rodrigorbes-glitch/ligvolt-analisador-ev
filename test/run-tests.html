<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIGVOLT | Execução de Testes Automatizados</title>
  <style>
    body {
      background-color: #0C0E12;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #14171F;
      border: 1px solid #283040;
      border-radius: 12px;
      padding: 24px;
    }
    h1 {
      color: #9DEC0F;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .test-output {
      background: #090B0E;
      border: 1px solid #283040;
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-x: auto;
      margin-top: 16px;
    }
    .pass { color: #9DEC0F; }
    .fail { color: #FF4D4D; }
    .btn-run {
      background: #9DEC0F;
      color: #0E1116;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-run:hover {
      background: #8BD70B;
    }
    a { color: #9DEC0F; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ LIGVOLT — Suíte de Testes Elétricos, Normativos e Dossiê</h1>
    <p>Validação automatizada de regras ABNT NBR 5410, NBR 17019, IEC 61851, CBMERJ 326/2025, Laudos e Pedido de Aumento de Carga.</p>
    <div style="margin-top: 14px;">
      <button type="button" class="btn-run" id="btnRun">▶ Executar Todos os Testes</button>
      <a href="../index.html" style="margin-left: 14px;">← Voltar ao Aplicativo</a>
    </div>
    <div id="testOutput" class="test-output">Clique em "Executar Todos os Testes" para iniciar.</div>
  </div>

  <script src="../js/electrical-tables.js"></script>
  <script src="../js/calculation-engine.js"></script>
  <script src="../js/compliance-rules.js"></script>
  <script src="../js/diagnostic-engine.js"></script>
  <script src="../js/dossier-generator.js"></script>
  <script src="../js/smart-inspection.js"></script>

  <script>
    document.getElementById('btnRun').addEventListener('click', function () {
      const output = document.getElementById('testOutput');
      output.innerHTML = '';
      
      let logs = [];
      let passed = 0;
      let failed = 0;

      function log(msg, type) {
        logs.push(`<span class="${type || ''}">${msg}</span>`);
      }

      function assert(cond, name, detail) {
        if (cond) {
          log(`  ✅ [PASS] ${name}`, 'pass');
          passed++;
        } else {
          log(`  ❌ [FAIL] ${name} ${detail ? '- ' + detail : ''}`, 'fail');
          failed++;
        }
      }

      const Tables = window.LigvoltTables;
      const Engine = window.LigvoltEngine;
      const Compliance = window.LigvoltCompliance;
      const Diagnostic = window.LigvoltDiagnostic;
      const Dossier = window.LigvoltDossier;

      log('--- TESTE 1: Dimensionamento do PE (NBR 5410 Tabela 58) ---');
      assert(Tables.calculateProtectiveConductor(2.5) === 2.5, 'Fase 2.5mm² -> PE 2.5mm²');
      assert(Tables.calculateProtectiveConductor(6) === 6, 'Fase 6mm² -> PE 6mm²');
      assert(Tables.calculateProtectiveConductor(16) === 16, 'Fase 16mm² -> PE 16mm²');
      assert(Tables.calculateProtectiveConductor(25) === 16, 'Fase 25mm² -> PE 16mm²');
      assert(Tables.calculateProtectiveConductor(35) === 16, 'Fase 35mm² -> PE 16mm²');
      assert(Tables.calculateProtectiveConductor(50) === 25, 'Fase 50mm² -> PE 25mm² (50/2)');
      assert(Tables.calculateProtectiveConductor(70) === 35, 'Fase 70mm² -> PE 35mm² (70/2)');

      log('\n--- TESTE 2: Seleção de Disjuntores Comerciais ---');
      assert(Tables.getNextCommercialBreaker(32) === 32, 'Corrente 32A -> Disjuntor 32A');
      assert(Tables.getNextCommercialBreaker(32.1) === 40, 'Corrente 32.1A -> Disjuntor 40A');
      assert(Tables.getNextCommercialBreaker(40) === 40, 'Corrente 40A -> Disjuntor 40A (margem 125%)');
      assert(Tables.getNextCommercialBreaker(55) === 63, 'Corrente 55A -> Disjuntor 63A');

      log('\n--- TESTE 3: 1 Carregador 32A Monofásico a 20m ---');
      const res1 = Engine.calculateInstallation({
        distance: 20,
        supplyType: 'monofasica',
        voltageSingle: 220,
        mainBreaker: 63,
        existingDemand: 15,
        cableInsulation: 'PVC',
        installationMethod: 'B1',
        useContinuousMargin: true,
        chargers: [{ id: 1, name: 'Wallbox 32A', nominalCurrent: 32, enabled: true, phaseConfig: 'L1-N' }]
      });
      assert(res1.status === 'OK', 'Cálculo executado com sucesso');
      assert(res1.chargers[0].projectCurrent === 40, 'Corrente com margem 125% = 40A');
      assert(res1.chargers[0].cableSection >= 6, `Cabo dimensionado: ${res1.chargers[0].cableSection}mm²`);
      assert(res1.chargers[0].voltageDropPercent <= 4.0, `Queda: ${res1.chargers[0].voltageDropPercent}% <= 4%`);
      assert(res1.comparison.recommendedScenario === 'B', 'Recomendado Cenário B para 1 carregador');

      log('\n--- TESTE 4: 2 Carregadores 32A Trifásicos a 30m ---');
      const res2 = Engine.calculateInstallation({
        distance: 30,
        supplyType: 'trifasica',
        voltagePreset: '220_380',
        mainBreaker: 100,
        existingDemand: { L1: 20, L2: 20, L3: 20 },
        chargers: [
          { id: 1, name: 'EV 1', nominalCurrent: 32, enabled: true, phaseConfig: '3F' },
          { id: 2, name: 'EV 2', nominalCurrent: 32, enabled: true, phaseConfig: '3F' }
        ]
      });
      assert(res2.scenarioA.breakerRating >= 80, `Disjuntor alimentador Cenário A: ${res2.scenarioA.breakerRating}A`);
      assert(res2.comparison.recommendedScenario === 'A', 'Recomendado Cenário A para múltiplos carregadores a 30m');

      log('\n--- TESTE 5: Detecção de Sobrecarga e 4 Estados do Diagnóstico ---');
      const resOver = Engine.calculateInstallation({
        distance: 15,
        supplyType: 'trifasica',
        voltagePreset: '220_380',
        mainBreaker: 63,
        existingDemand: { L1: 45, L2: 45, L3: 45 },
        chargers: [{ id: 1, name: 'Wallbox 32A', nominalCurrent: 32, enabled: true, phaseConfig: '3F' }]
      });
      assert(resOver.phaseSummary.isOverloaded === true, 'Sobrecarga detectada');
      const diagOver = Diagnostic.evaluateDiagnostic(resOver, { item_grounding_pe: 'adequado', item_location: 'adequado', item_sprinklers: 'adequado' });
      assert(diagOver.state === 'NAO_APTO', 'Diagnóstico NÃO APTO em caso de sobrecarga');

      const resInc = Engine.calculateInstallation({
        distance: 15,
        supplyType: 'trifasica',
        voltagePreset: '220_380',
        mainBreaker: null,
        chargers: [{ id: 1, name: 'Wallbox 32A', nominalCurrent: 32, enabled: true, phaseConfig: '3F' }]
      });
      const diagInc = Diagnostic.evaluateDiagnostic(resInc, {});
      assert(diagInc.state === 'INCOMPLETA', 'Diagnóstico INCOMPLETA sem dados essenciais');

      log('\n--- TESTE 6: Regra CBMERJ CHEMG 326/2025 ---');
      const diagSpr = Diagnostic.evaluateDiagnostic(res1, { item_sprinklers: 'inadequado' });
      assert(diagSpr.state === 'NAO_APTO', 'Garagem fechada sem sprinklers gera NÃO APTO');

      log('\n--- TESTE 7: Laudo Técnico, Memória de Cálculo e Pedido Concessionária ---');
      const diagAdeq = Diagnostic.evaluateDiagnostic(res1, {
        item_location: 'adequado',
        item_sprinklers: 'adequado',
        item_grounding_pe: 'adequado',
        item_panel_integrity: 'adequado',
        item_dr_dps: 'inadequado'
      });
      const laudo = Dossier.buildTechnicalOpinion(res2, diagAdeq, {}, { clientName: 'Edifício Teste' });
      assert(laudo.includes('LAUDO TÉCNICO DE ENGENHARIA ELÉTRICA'), 'Laudo técnico pericial gerado com sucesso');

      const memoria = Dossier.buildCalculationMemory(res2, {});
      assert(memoria.includes('MEMÓRIA DE CÁLCULO ELÉTRICO NORMATIVO'), 'Memória de cálculo gerada com sucesso');

      const pedConc = Dossier.buildConcessionaireRequest(res2, { concessionaria: 'Light S.A.' });
      assert(pedConc.includes('MEMORIAL DESCRITIVO PARA PEDIDO DE AUMENTO DE CARGA'), 'Pedido de aumento de carga para concessionária gerado');

      // TESTES DE VISTORIA INTELIGENTE COM IA
      log(`\n=============================================================`);
      log(`🤖 TESTES DE VISTORIA INTELIGENTE COM IA & CASOS DE BORDA`);
      log(`=============================================================`);

      const SmartInspection = window.LigvoltSmartInspection;

      // CASO 1
      const inspCase1 = {
        localData: { locationType: 'residencia', installArea: 'garagem_aberta', vehicleCount: 1, chargerType: 'wallbox', distanceApprox: '10-25', cityState: 'Curitiba - PR' },
        confirmations: { mainBreakerConfirmed: '50', groundingConfirmed: 'sim', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'sim', exclusiveCircuitConfirmed: 'nao', capacityVerified: 'nao_sei', cbmerjSprinklers: 'nao_se_aplica' },
        photos: []
      };
      const diagCase1 = SmartInspection.evaluateInspectionViability(inspCase1);
      assert(diagCase1.state === 'APTO_COM_ADEQUACOES', 'Caso 1: Classificação APTO COM ADEQUAÇÕES');
      assert(diagCase1.necessaryActions.some(a => a.includes('exclusivo')), 'Caso 1: Exige criação de circuito exclusivo');
      assert(diagCase1.necessaryActions.some(a => a.includes('medição')), 'Caso 1: Exige medição de corrente de pico');

      // CASO 2
      const inspCase2 = {
        localData: { locationType: 'condominio', installArea: 'garagem_aberta', vehicleCount: 1, chargerType: 'wallbox', distanceApprox: '25-50', cityState: 'São Paulo - SP' },
        confirmations: { mainBreakerConfirmed: '63', groundingConfirmed: 'nao_sei', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'nao', exclusiveCircuitConfirmed: 'nao', capacityVerified: 'nao_sei', cbmerjSprinklers: 'nao_se_aplica' },
        photos: []
      };
      const diagCase2 = SmartInspection.evaluateInspectionViability(inspCase2);
      assert(diagCase2.necessaryActions.some(a => a.includes('subquadro') || a.includes('quadro')), 'Caso 2: Exige subquadro elétrico auxiliar');

      // CASO 3
      const inspCase3 = {
        localData: { locationType: 'residencia', installArea: 'garagem_aberta', vehicleCount: 1, chargerType: 'wallbox', distanceApprox: '<10', cityState: 'Belo Horizonte - MG' },
        confirmations: { mainBreakerConfirmed: 'nao_sei', groundingConfirmed: 'nao_sei', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'nao_sei', exclusiveCircuitConfirmed: 'nao', capacityVerified: 'nao_sei', cbmerjSprinklers: 'nao_se_aplica' },
        photos: []
      };
      const diagCase3 = SmartInspection.evaluateInspectionViability(inspCase3);
      assert(diagCase3.state === 'NECESSITA_VERIFICACAO', 'Caso 3: Sem disjuntor resulta em NECESSITA VERIFICAÇÃO TÉCNICA');

      // CASO 4
      const inspCase4 = {
        localData: { locationType: 'residencia', installArea: 'garagem_aberta', vehicleCount: 1, chargerType: 'wallbox', distanceApprox: '<10', cityState: 'Rio de Janeiro - RJ' },
        confirmations: { mainBreakerConfirmed: '50', groundingConfirmed: 'nao', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'sim', exclusiveCircuitConfirmed: 'nao', capacityVerified: 'nao_sei', cbmerjSprinklers: 'nao_se_aplica' },
        photos: []
      };
      const diagCase4 = SmartInspection.evaluateInspectionViability(inspCase4);
      assert(diagCase4.criticalActions.some(a => a.includes('aterramento')), 'Caso 4: Ação crítica de aterramento TN-S');

      // CASO 5
      const inspCase5 = {
        localData: { locationType: 'condominio', installArea: 'subsolo', vehicleCount: 2, chargerType: 'wallbox', distanceApprox: '25-50', cityState: 'Rio de Janeiro - RJ' },
        confirmations: { mainBreakerConfirmed: '100', groundingConfirmed: 'sim', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'sim', exclusiveCircuitConfirmed: 'nao', capacityVerified: 'sim', cbmerjSprinklers: 'nao' },
        photos: []
      };
      const diagCase5 = SmartInspection.evaluateInspectionViability(inspCase5);
      assert(diagCase5.state === 'NAO_APTO', 'Caso 5: Subsolo sem sprinklers no RJ resulta em NÃO APTO');

      // CASO 6
      const inspCase6 = {
        localData: { locationType: 'residencia', installArea: 'garagem_aberta', vehicleCount: 2, chargerType: 'wallbox', distanceApprox: '<10', cityState: 'Campinas - SP' },
        confirmations: { mainBreakerConfirmed: '40', groundingConfirmed: 'sim', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'sim', exclusiveCircuitConfirmed: 'nao', capacityVerified: 'nao_sei', cbmerjSprinklers: 'nao_se_aplica' },
        photos: []
      };
      const diagCase6 = SmartInspection.evaluateInspectionViability(inspCase6);
      assert(diagCase6.state === 'NAO_APTO', 'Caso 6: Sobrecarga crítica resulta em NÃO APTO');

      // CASO 7 & 8
      const reportHtml = SmartInspection.buildPreliminaryInspectionReportHTML({
        localData: inspCase1.localData,
        confirmations: inspCase1.confirmations,
        photos: [{ id: '1', categoryName: 'Foto Geral', dataUrl: 'data:image/jpeg;base64,123', timestamp: '24/10/2026' }],
        clientMeta: { clientName: 'João da Silva' }
      }, diagCase1);
      assert(reportHtml.includes('RELATÓRIO PRELIMINAR DE VISTORIA E VIABILIDADE'), 'Caso 8: Título do laudo preliminar gerado');
      assert(reportHtml.includes('Alimentação Elétrica:'), 'Caso 8: Seção de alimentação elétrica presente no laudo');
      assert(reportHtml.includes('Natureza Preliminar Deste Relatório'), 'Caso 8: Aviso legal obrigatório presente');

      // CASO 9: Vistoria com Alimentação e Tensão Desconhecidas
      const inspCase9 = {
        localData: {
          locationType: 'residencia', installArea: 'garagem_aberta', supplyType: 'nao_sei', voltagePreset: 'nao_sei',
          vehicleCount: 1, chargerType: 'wallbox', distanceApprox: '10-25'
        },
        confirmations: {
          mainBreakerConfirmed: '50', groundingConfirmed: 'sim', rainProtectionConfirmed: 'sim', spaceAvailableConfirmed: 'sim',
          exclusiveCircuitConfirmed: 'sim', capacityVerified: 'sim', cbmerjSprinklers: 'nao_se_aplica'
        },
        photos: []
      };
      const diagCase9 = SmartInspection.evaluateInspectionViability(inspCase9);
      assert(diagCase9.problemsFound.some(p => p.title.includes('alimentação')), 'Caso 9: Pendência para tipo de alimentação desconhecido');
      assert(diagCase9.problemsFound.some(p => p.title.includes('Tensão')), 'Caso 9: Pendência para tensão desconhecida');

      // CASO 10: Dimensionamento Bifásico 127/220V
      const resBifasica = Engine.calculateInstallation({
        distance: 20, supplyType: 'bifasica', voltagePreset: '127_220', mainBreaker: 50,
        existingDemand: { L1: 15, L2: 10 }, cableInsulation: 'PVC', installationMethod: 'B1', groupingCircuits: 1,
        chargers: [{ id: 1, name: 'Wallbox Residencial (F-F)', nominalCurrent: 32, enabled: true, phaseConfig: 'L1-L2' }]
      });
      assert(resBifasica.status === 'OK', 'Caso 10: Instalação bifásica calculada com sucesso');
      assert(resBifasica.phaseSummary.phases.A.evProject === 40, 'Caso 10: Fase A recebe 40A do carregador L1-L2');
      assert(resBifasica.phaseSummary.phases.B.evProject === 40, 'Caso 10: Fase B recebe 40A do carregador L1-L2');
      assert(resBifasica.phaseSummary.maxPhaseProject === 55, 'Caso 10: Corrente máxima 55A sem soma escalar incorreta');

      log(`\n====================================================`);
      log(`🏁 RESULTADO FINAL: ${passed} PASSARAM | ${failed} FALHARAM`, failed === 0 ? 'pass' : 'fail');
      log(`====================================================`);

      output.innerHTML = logs.join('\n');
    });
  </script>
</body>
</html>
